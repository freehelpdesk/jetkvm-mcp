[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jetkvm-mcp"
version = "0.1.0"
description = "MCP server that lets Grok, Grok Bot, and other agents operate a computer through a JetKVM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiortc>=1.14",
    "aiohttp>=3.9",
    "mcp>=2.3,<3",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
jetkvm-mcp = "jetkvm_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jetkvm_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
